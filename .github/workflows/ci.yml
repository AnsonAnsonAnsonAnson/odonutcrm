# Runs type checks, the web build and the full test suite on every push and pull request.
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odonut_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/odonut_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The runner context isn't allowed in job-level env, so the cert folder is set per step.
      - run: bash server/scripts/make-test-certs.sh "$TEST_CERT_DIR"
        env:
          TEST_CERT_DIR: ${{ runner.temp }}/odcerts
      - run: npm test
        env:
          TEST_CERT_DIR: ${{ runner.temp }}/odcerts

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t odonut:ci .
