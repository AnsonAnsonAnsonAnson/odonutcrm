# Production-style stack: Postgres + the app + Caddy (automatic HTTPS from Let's Encrypt).
# 1. cp .env.example .env and fill it in   2. point your domain's DNS at this server
# 3. put Apple/Google files in ./secrets   4. docker compose up -d --build
# Behind Cloudflare: sudo bash scripts/cloudflare.sh (sets CADDY_MODE=cloudflare in .env).

# Every container: no privilege escalation, and logs capped so they can't fill the disk.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    # Only reachable by the other containers on the private network, never from the internet.
    environment:
      POSTGRES_DB: odonut
      POSTGRES_USER: odonut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odonut -d odonut"]
      interval: 5s
      retries: 10

  app:
    <<: *hardening
    build: .
    restart: unless-stopped
    # The app can't change its own files: a break-in can't plant code that survives a restart.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    env_file: .env
    environment:
      DATABASE_URL: postgres://odonut:${POSTGRES_PASSWORD}@db:5432/odonut
    volumes:
      - ./secrets:/secrets:ro
      # Optional brand art for the pass: icon.png, logo.png, stamp-on.png, stamp-off.png
      - ./server/assets/pass:/app/server/assets/pass:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  # Nightly database backup to ./backups (kept 30 days). Copy that folder off the server too.
  # Restore: gunzip -c backups/odonut-YYYYMMDD-HHMM.sql.gz | docker compose exec -T db psql -U odonut -d odonut
  backup:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: odonut
      PGDATABASE: odonut
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Hong_Kong
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/odonut-$$(date +%Y%m%d-%H%M).sql.gz
          if pg_dump --no-owner --clean --if-exists | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok $$f"; else rm -f "$$f.tmp"; echo "backup FAILED"; fi
          find /backups -name 'odonut-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    restart: unless-stopped
    # direct: Caddy gets a Let's Encrypt certificate itself. cloudflare: only Cloudflare may
    # connect, with the Cloudflare Origin Certificate (see caddy/cloudflare.Caddyfile).
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_MODE:-direct}.Caddyfile", "--adapter", "caddyfile"]
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./secrets/cloudflare:/certs:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
