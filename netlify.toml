# Netlify test deployment: the web app as static files, the API as a Netlify Function and
# Postgres from Netlify DB (or any DATABASE_URL). Setup steps: docs/07-netlify-test.md.
[build]
  # Builds the web app, then bundles the API so it runs on any Node version Netlify picks.
  command = "npm run build:netlify"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Native image library and the pass signer load at runtime from node_modules.
  external_node_modules = ["sharp", "passkit-generator", "pg"]
  # The API itself is pre-bundled by scripts/build-netlify.mjs; these files are read at runtime.
  included_files = ["server/migrations/**", "server/assets/**"]

# Client-side routes (/me, /staff, /admin...) all load the single-page app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
